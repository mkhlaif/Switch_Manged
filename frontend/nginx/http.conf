# Plain HTTP on :8080. Use for lab work or behind a TLS-terminating load balancer / reverse
# proxy (which must set X-Forwarded-Proto). For direct HTTPS use https.conf.
server_tokens off;
# Rate-limit zones (per client IP), used in app-locations.conf.
limit_req_zone $binary_remote_addr zone=login:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_status 429;
map $http_x_forwarded_proto $forwarded_proto { default $http_x_forwarded_proto; "" $scheme; }
map $scheme $hsts { default ""; }

server {
    listen 8080;
    server_name _;
    include /etc/nginx/snippets/app-locations.conf;
}
