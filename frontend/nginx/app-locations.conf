# Shared by http.conf and https.conf. The SPA and the API share one origin, which the
# SameSite=strict session cookie and the CSRF double-submit token rely on.
#
# X-Forwarded-For is OVERWRITTEN with the TCP peer address ($remote_addr), never appended to:
# the backend trusts the first X-Forwarded-For entry, so a client-supplied value would let anyone
# forge the source IP used for rate limits and the audit log. Behind a TLS load balancer, add
#   set_real_ip_from <load-balancer-ip>;  real_ip_header X-Forwarded-For;
# to the server block so that $remote_addr becomes the real client (see docs/NETWORK_SETUP.md).
root /usr/share/nginx/html;
client_max_body_size 1m;
include /etc/nginx/snippets/security-headers.conf;

# Live search progress (Server-Sent Events): never buffer, allow long-lived streams.
location ~ ^/api/mac/search/[^/]+/events$ {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
}

# Container health check of nginx itself (no backend involved).
location = /nginx-health { access_log off; default_type text/plain; return 200 "ok"; }

# Health check (no authentication, no secrets): /health -> /api/health
location = /health {
    proxy_pass http://backend:8000/api/health;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
}

# Rate limits (zones in http.conf / https.conf). The backend enforces its own per-user limits;
# these protect the process from floods before a request reaches it.
location = /api/auth/login {
    limit_req zone=login burst=10 nodelay;
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_read_timeout 30s;
}

# Bulk switch import: the only request allowed a large body (5 MB file, JSON-encoded).
location = /api/switches/import/validate {
    client_max_body_size 12m;
    limit_req zone=api burst=20 nodelay;
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_read_timeout 300s;
}

location /api/ {
    limit_req zone=api burst=100 nodelay;
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 300s;
}

location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
}

location / {
    add_header Cache-Control "no-store" always;
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri /index.html;
}
