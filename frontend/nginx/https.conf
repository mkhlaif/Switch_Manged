# Direct HTTPS on :8443 (certificate + key mounted at /etc/nginx/certs/), HTTP :8080 redirects.
server_tokens off;
map $http_x_forwarded_proto $forwarded_proto { default $http_x_forwarded_proto; "" $scheme; }
map $scheme $hsts { https "max-age=31536000; includeSubDomains"; default ""; }

server {
    listen 8080;
    server_name _;
    # Container health check (answered locally, never redirected).
    location = /nginx-health { access_log off; default_type text/plain; return 200 "ok"; }
    # __HTTPS_PORT__ is replaced at container start with ":<HTTPS_PORT>" (empty for 443),
    # so the redirect also works when HTTPS is published on a non-standard port.
    location / { return 301 https://$host__HTTPS_PORT__$request_uri; }
}

server {
    listen 8443 ssl;
    http2 on;
    server_name _;
    ssl_certificate     /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    include /etc/nginx/snippets/app-locations.conf;
}
