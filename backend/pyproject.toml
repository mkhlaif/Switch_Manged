[project]
name = "omniswitch-mac-locator"
version = "1.0.0"
description = "MAC address discovery and controlled port restart for Alcatel-Lucent Enterprise OmniSwitch (AOS)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
